{
  "name": "CI",
  "on": {
    "push": {
      "branches": [
        "main"
      ]
    },
    "pull_request": {
      "branches": [
        "main"
      ]
    },
    "workflow_dispatch": {}
  },
  "permissions": {
    "contents": "read"
  },
  "concurrency": {
    "group": "ci-${{ github.ref }}",
    "cancel-in-progress": true
  },
  "jobs": {
    "compile": {
      "name": "Compile",
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 30,
      "steps": [
        {
          "name": "Check out the repository",
          "uses": "actions/checkout@v4"
        },
        {
          "name": "Set up JDK 21",
          "uses": "actions/setup-java@v4",
          "with": {
            "distribution": "temurin",
            "java-version": "21",
            "cache": "gradle"
          }
        },
        {
          "name": "Compile Kotlin",
          "run": "./gradlew --no-daemon compileKotlin compileTestKotlin"
        }
      ]
    },
    "test": {
      "name": "Tests",
      "needs": "compile",
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 90,
      "steps": [
        {
          "name": "Check out the repository",
          "uses": "actions/checkout@v4"
        },
        {
          "name": "Set up JDK 21",
          "uses": "actions/setup-java@v4",
          "with": {
            "distribution": "temurin",
            "java-version": "21",
            "cache": "gradle"
          }
        },
        {
          "name": "Container runtime",
          "run": "docker version --format 'server={{.Server.Version}}'"
        },
        {
          "name": "Run every public module test task",
          "env": {
            "QUARKUS_HTTP_TEST_PORT": "0"
          },
          "run": "./gradlew --no-daemon test"
        },
        {
          "name": "Upload test reports",
          "if": "always()",
          "uses": "actions/upload-artifact@v4",
          "with": {
            "name": "test-reports",
            "path": "**/build/reports/tests/",
            "retention-days": 7
          }
        }
      ]
    },
    "frontend": {
      "name": "Frontend web (build + unit tests)",
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 30,
      "steps": [
        {
          "name": "Check out the repository",
          "uses": "actions/checkout@v4"
        },
        {
          "name": "Set up Node.js 22",
          "uses": "actions/setup-node@v4",
          "with": {
            "node-version": "22",
            "cache": "npm",
            "cache-dependency-path": "frontend/web/package-lock.json"
          }
        },
        {
          "name": "Install dependencies",
          "working-directory": "frontend/web",
          "run": "npm ci"
        },
        {
          "name": "Lint (non-blocking: pre-existing findings)",
          "working-directory": "frontend/web",
          "run": "npm run lint",
          "continue-on-error": true
        },
        {
          "name": "Unit tests (vitest)",
          "working-directory": "frontend/web",
          "run": "npx vitest run"
        },
        {
          "name": "Build",
          "working-directory": "frontend/web",
          "run": "npm run build"
        },
        {
          "name": "Browser helpers and collection (no live stack)",
          "working-directory": "tests/e2e",
          "run": "npm ci\nnpm run test:helpers\nnpx playwright test --list --reporter=list\nnpx playwright test --config=playwright.operational.config.ts --list --reporter=list"
        }
      ]
    },
    "mobile": {
      "name": "Floor PWA (build + unit tests)",
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 30,
      "steps": [
        {
          "name": "Check out the repository",
          "uses": "actions/checkout@v4"
        },
        {
          "name": "Set up Node.js 22",
          "uses": "actions/setup-node@v4",
          "with": {
            "node-version": "22",
            "cache": "npm",
            "cache-dependency-path": "frontend/mobile/package-lock.json"
          }
        },
        {
          "name": "Install dependencies",
          "working-directory": "frontend/mobile",
          "run": "npm ci"
        },
        {
          "name": "Lint",
          "working-directory": "frontend/mobile",
          "run": "npm run lint"
        },
        {
          "name": "Unit tests (vitest)",
          "working-directory": "frontend/mobile",
          "run": "npx vitest run"
        },
        {
          "name": "Build",
          "working-directory": "frontend/mobile",
          "run": "npm run build"
        }
      ]
    },
    "quality": {
      "name": "Quality",
      "needs": "compile",
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 45,
      "steps": [
        {
          "name": "Check out the repository",
          "uses": "actions/checkout@v4"
        },
        {
          "name": "Set up JDK 21",
          "uses": "actions/setup-java@v4",
          "with": {
            "distribution": "temurin",
            "java-version": "21",
            "cache": "gradle"
          }
        },
        {
          "name": "Detekt static analysis",
          "run": "./gradlew --no-daemon detekt"
        },
        {
          "name": "Upload quality reports",
          "if": "always()",
          "uses": "actions/upload-artifact@v4",
          "with": {
            "name": "quality-reports",
            "path": "**/build/reports/detekt/",
            "retention-days": 7
          }
        }
      ]
    },
    "package": {
      "name": "Package",
      "needs": [
        "compile",
        "test",
        "frontend",
        "mobile",
        "quality"
      ],
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 60,
      "steps": [
        {
          "name": "Check out the repository",
          "uses": "actions/checkout@v4"
        },
        {
          "name": "Set up JDK 21",
          "uses": "actions/setup-java@v4",
          "with": {
            "distribution": "temurin",
            "java-version": "21",
            "cache": "gradle"
          }
        },
        {
          "name": "Build karyo-app (Quarkus fast-jar)",
          "run": "./gradlew --no-daemon :services:karyo-app:quarkusBuild -Dquarkus.profile=prod"
        },
        {
          "name": "Build the application image",
          "run": "SOURCE_DATE_EPOCH=0 docker build -f infrastructure/docker/Dockerfile.service --build-arg SERVICE_DIR=services/karyo-app -t \"karyo-app:${{ github.sha }}\" ."
        },
        {
          "name": "Build the web image",
          "run": "SOURCE_DATE_EPOCH=0 docker build -f infrastructure/docker/Dockerfile.nginx -t \"karyo-nginx:${{ github.sha }}\" ."
        },
        {
          "name": "Images are built, not published",
          "run": "echo 'Both images built successfully. This workflow publishes nothing: the free tier is built from source by whoever runs it.'"
        }
      ]
    }
  }
}
